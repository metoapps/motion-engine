<!doctype html>
<!-- THESIS: an editable launch film is the proof. OWN-WORLD: approved Raywake prism, crimson, paper and charcoal, local Manrope. STORY: an idea becomes image, video and sound, then a launch. FIRST VIEWPORT: the stage fills the frame; the film remains readable at each supported aspect ratio. FORM: a product launch in the existing Raywake identity, selected by the owner. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raywake launch · motion-engine</title>
<style>
@font-face{font-family:Manrope;src:url('./assets/fonts/manrope-latin.woff2') format('woff2');font-weight:200 800;font-display:block}
@font-face{font-family:Manrope;src:url('./assets/fonts/manrope-latin-ext.woff2') format('woff2');font-weight:200 800;font-display:block;unicode-range:U+0100-02FF}
*{box-sizing:border-box}body{margin:0;background:#222221;display:grid;min-height:100svh;place-items:center}#stage{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#f7f5ef}canvas{display:block;width:100%;height:100%}.caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body.preview #stage{width:min(100vw,calc(100svh * var(--ratio)));height:auto;aspect-ratio:var(--ratio)}
</style></head><body><main id="stage" aria-label="Animated Raywake product launch"><canvas id="film"></canvas><p class="caption">Ideas deserve a launch. Image, video and audio. Your next launch, with Raywake. raywake.si.</p></main>
<script src="./config.js"></script><script src="./engine/runtime.js"></script><script src="./scene.js"></script></body></html>
